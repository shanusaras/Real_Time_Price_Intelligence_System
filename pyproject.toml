[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "price-intelligence-system"
version = "0.1.0"
description = "A real-time price intelligence system for tracking and analyzing product prices across e-commerce platforms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.12.1",
    "aiomysql>=0.1.1",
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.6",
    "redis>=5.0.0",
    "slowapi>=0.1.8",
    "sentry-sdk[fastapi]>=1.35.0",
    "structlog>=23.1.0",
    "python-json-logger>=2.0.7",
    "pandas>=2.0.3",
    "numpy>=1.24.3",
    "aiosmtplib>=2.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.1",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "types-requests>=2.31.0.1",
    "pre-commit>=3.5.0",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.1",
]

[project.urls]
Homepage = "https://github.com/yourusername/Real_Time_Price_Intelligence_System"
Bug Tracker = "https://github.com/yourusername/Real_Time_Price_Intelligence_System/issues"
Documentation = "https://github.com/yourusername/Real_Time_Price_Intelligence_System#readme"

[tool.black]
line-length = 88
target-version = ["py39"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "sqlalchemy.*",
    "alembic.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v -s --cov=api --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["api"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[alembic]
script_location = "alembic"
sqlalchemy.url = "mysql+pymysql://user:password@localhost/price_intelligence"

[alembic.script]
version_locations = "alembic/versions"

[alembic.script.migration]
branch_labels = None
version_path_separator = ':'

[alembic.script.revision_environment]
revision_file = "alembic/script.py.mako"
